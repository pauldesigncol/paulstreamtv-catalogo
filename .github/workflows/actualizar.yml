name: Actualizar catálogo

on:
  schedule:
    - cron: "0 6 * * *" # todos los días a las 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ejecutar el robot
        run: node robot/index.mjs
      - name: Publicar cambios
        run: |
          git config user.name "robot-catalogo"
          git config user.email "robot-catalogo@users.noreply.github.com"
          git add -A paises completo estado index.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Catálogo actualizado $(date -u +%F)"
            git push
          fi
